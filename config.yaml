# ============================================================================
# LLM Translator — Master Configuration
# Lightweight translation client with selectable DeepSeek and Qwen providers.
# ============================================================================

# ── Project Identity ────────────────────────────────────────────────────────
project:
  target_language: en
  name: LLM Translator
  version: 1.0.0

# ── File System Paths ───────────────────────────────────────────────────────
paths:
  input_dir: raw/          # Source EPUBs for extraction
  work_dir: work/           # Per-volume working directories
  output_dir: output/       # Final assembled EPUBs
  prompt_dir: src/Deepseek/prompt/   # Master translation prompts
  log_dir: logs/            # Debug and cost logs

# ── MCP Phase Routing (optional) ────────────────────────────────────────────
# Overrides for src/mcp/harness.py's phase-name -> MCP-tool-name map, exposed
# over MCP as the routing://phases resource. Every phase already has a
# sensible built-in default (see harness.py::DEFAULT_PHASE_ROUTES) — this
# section only needs entries you actually want to change, e.g. pointing
# "translate" at a future parallel-translation tool without touching code.
# phase_routing:
#   translate: run_translator

# ── Prep (Cached Multi-turn Context Build) ──────────────────────────────────
# One persisted DeepSeek conversation fills 15 generated blocks as JSON nodes;
# the Librarian-owned opf_metadata block makes 16 prep data blocks in total.
# The final JSON-to-XML assembly is deterministic and atomic.
# No Gemini, ChromaDB, or main-pipeline subprocess is involved.
prep:
  # The default is the direct MiniMax-M3 cache loop. The original DeepSeek
  # unified, multi-turn, and parallel paths remain selectable recovery routes.
  provider: minimax                 # minimax | deepseek
  minimax:
    model: MiniMax-M3
    endpoint: https://api.minimax.io/anthropic
    api_key_env: MINIMAX_API_KEY
    max_output_tokens: 512000
    context_window: 1000000
    http_timeout_seconds: 900
    # Keep the static prefix + volume source package byte-identical across
    # block calls. MiniMax-M3 uses passive prefix caching; explicit markers
    # are reserved for a compatible M2.x model if both values are changed.
    cache:
      mode: passive                 # passive | explicit
      threshold_tokens: 512
    # False avoids spending another provider's budget behind the operator's
    # back. Set true only when DeepSeek is an intentional recovery route.
    fallback_to_deepseek: false

  # DeepSeek recovery-path defaults. Read only when prep.provider is deepseek.
  model: deepseek-v4-flash
  endpoint: https://api.deepseek.com/anthropic
  api_key_env: DEEPSEEK_API_KEY
  prompt: src/Deepseek/prompt/prep_prompt_deepseek_en.xml
  thinking_budget: 64000
  max_output_tokens: 384000
  effort: xhigh                       # output_config.effort for every prep
                                      # Pro call (unified path's single call,
                                      # and the parallel path's phase1_pro_root)
  http_timeout_seconds: 900
  # Where cross-volume series bibles live. Sequel detection: if
  # bible_dir/<series_id>/ exists, prep_volume loads it first and injects
  # the accumulated term_lock/verbatim_anchors/voice_fingerprints so DeepSeek
  # has continuity context instead of reinventing names from scratch.
  bible_dir: bibles/

  # ── Web Search Lock (metadata_localization / blk-17) ─────────────────────
  # Prep's web-search tool is URL-LOCKED: every grounding query for author /
  # illustrator / publisher / title must be scoped to locked_url, built from
  # keyword_format. Mirrors the Web Search Lock in .github/agents/mtl-prep.agent.md
  # and blk-17-metadata-localization.agent.md — this is the config-layer
  # declaration of record so the CLI/agent prep path reads the same lock.
  web_search:
    enabled: true
    # The first provider preserves the exact Bookwalker URL contract. The
    # remaining providers are discovery/corroboration fallbacks only.
    providers:
      - bookwalker_direct
      - brave
      - ndl
      - serpapi
      - tavily
      - exa
    locked_url: https://bookwalker.jp/search/?qcat=&word=
    keyword_format: "[Japanese title] + [Author in Japanese] + Bookwalker"
    allowed_hosts:
      - bookwalker.jp
      - ndlsearch.ndl.go.jp
    timeout_seconds: 20
    max_results: 5
    # Values are environment-variable names, never credentials.
    api_key_env:
      brave: BRAVE_SEARCH_API_KEY
      serpapi: SERPAPI_API_KEY
      tavily: TAVILY_API_KEY
      exa: EXA_API_KEY
    endpoints:
      brave: https://api.search.brave.com/res/v1/web/search
      ndl: https://ndlsearch.ndl.go.jp/api/sru
      serpapi: https://serpapi.com/search.json
      tavily: https://api.tavily.com/search
      exa: https://api.exa.ai/search
    tavily_search_depth: basic
    tavily_exact_match: true

  # ── Parallel Cache-Warmed Prep (PARALLEL_PREP_GUIDE.md) ───────────────────
  # Alternative to the single unified Pro call above: one Pro call extracts
  # character_roster + name_map (establishes the JP-chapters prefix in
  # DeepSeek's disk cache), one sequential Flash call warms that cache, then
  # 12 more Flash calls fire in parallel — each returning one small block
  # instead of the unified path re-echoing the whole ~50K-token document.
  # First real production run (2026-07-27, ギャルサーの家庭教師になった):
  # cache-warming confirmed working (95.7% hit ratio on calls 3-14), but
  # scene_plans truncated at 15,224/16,000 output tokens on a 16-chapter
  # volume — malformed XML, assembly failed, fallback_to_unified ate the
  # cost twice over ($0.048 wasted + $0.072 fallback vs. $0.048 if it hadn't
  # truncated). flash_max_output_tokens raised 16000 -> 32000 in response.
  parallel:
    # Disabled while multi_turn is active; the two strategies are mutually
    # exclusive to prevent a failure from multiplying API spend.
    enabled: false
    fallback_to_unified: false         # do not launch a second expensive
                                        # strategy automatically after failure;
                                        # keep artifacts for an explicit retry
    flash_model: deepseek-v4-flash
    flash_thinking_budget: 32000        # 0 disables extended thinking for
                                        # Flash calls entirely. Must stay
                                        # below flash_max_output_tokens —
                                        # budget_tokens counts against the
                                        # same ceiling as the block output.
    flash_max_output_tokens: 384000     # each call returns ONE block, not
                                        # the whole document, but the verbose
                                        # blocks (scene_plans, eps_arc_tracker,
                                        # cultural_glossary) ran 12-15K tokens
                                        # on a 16-chapter volume with only
                                        # 16000 to work with — see the incident
                                        # note above. 32000 gives real headroom
                                        # without meaningfully raising cost on
                                        # the cheap blocks (validation_audit
                                        # used all of 626).
    flash_effort: max                 # output_config.effort for every Flash
                                        # call in Phase 2 (warming + parallel)
    warming_block: voice_fingerprints  # which block the lone sequential
                                        # cache-warming call (Phase 2a) fills
    max_concurrent_flash_calls: 20    # well under Flash's documented 2500
                                        # concurrent-request ceiling

  # ── Multi-turn Prep with Prefix Cache (src/utility/prep/multiturn_agent.py) ─
  # Active default: one persisted, sequential DeepSeek conversation, one JSON
  # node turn per generated block. The fixed system prefix carries the prep
  # instructions, context shell, full JP source, optional bible, and one-time
  # metadata-search evidence. Each user turn carries only its block task.
  # Earlier accepted JSON turns remain visible as locked conversation history;
  # final JSON-to-XML assembly is deterministic and atomic.
  #
  # run_prep() rejects multi_turn + parallel together. Automatic fallback is
  # disabled by default so malformed output keeps artifacts for explicit retry.
  multi_turn:
    enabled: true
    conversation_kind: prep
    fallback_to_unified: false   # retain artifacts; retry explicitly to avoid double spend
    flash_model: deepseek-v4-flash
    thinking_budget: 64000              # 0 disables extended thinking
    effort: max                        # output_config.effort for every turn
    max_output_tokens: 384000            # per-block ceiling — one turn returns
                                         # ONE block's JSON envelope, not the
                                         # whole document
    cache_monitor:
      enabled: true
      warn_threshold_cache_hit_ratio: 0.70

    # Passed straight to DeepSeekConversationManager as its `config`. Prep's
    # conversation is short (15 turns, one per block) and the full JP text
    # only enters once (turn 1) — recent_verbatim_chapters is set >= the turn
    # count so the compaction ladder stays dormant for a normal-length volume;
    # it exists as the same safety net the translator relies on, not because
    # a prep run is expected to need it.
    conversation:
      recent_verbatim_chapters: 15
      checkpoint_trigger_ratio: 0.85
      soft_notice_ratio: 0.60
      tool_snip_ratio: 0.70
      checkpoint_force_ratio: 0.95
      checkpoint_max_output_tokens: 16000
      checkpoint_stuck_guard_turns: 2
      fail_closed_on_checkpoint_error: true
      persistence_file: .context/deepseek_prep_multiturn_conversation.json
      cache_user_id: true
      context_window: 1000000

  # Per-block reasoning archive for the multi-turn conversation — whichever
  # block was filled — name choices, canon grounding, schema decisions.
  # Already paid for (reasoning tokens bill as output regardless); archiving
  # it per block is a free audit trail for the assembler's validation and
  # LPPM-style review. Mirrors translation.thinking_log.
  thinking_log:
    enabled: true
    output_dir: THINKING              # work/<vol_id>/THINKING/ (prep subdir)
    capture_reasoning: true           # persist reasoning_details/thinking per block

# ── Translation Pipeline ────────────────────────────────────────────────────
translation:
  # ════════════════════════════════════════════════════════════════════════
  # GENERAL — provider route + shared prompt/log settings. These apply to
  # whichever provider is selected; provider-specific knobs live in the
  # `deepseek:`, `qwen:`, `openai:`, and `anthropic:` menus below.
  # ════════════════════════════════════════════════════════════════════════

  # Phase 2 provider route: deepseek | qwen | openai | anthropic.
  provider: openai                 # deepseek | qwen | openai | anthropic

  # Master prompt selection. The base prompt consolidates all 13 RAG module
  # policies inline — no external RAG modules, ChromaDB, or vector stores
  # are needed at runtime.
  #
  # ROUTING: this key feeds the DEEPSEEK route only (get_master_prompt_path()).
  # When translation.provider is "qwen", the Qwen client loads its own prompt
  # from translation.qwen.master_prompt below — this key is ignored then, so
  # do not point it at the Qwen prompt expecting it to ship.
  master_prompt: src/Deepseek/prompt/master_prompt_deepseek_en.xml

  # Optional: Use the V2 literacy-anchor variant for sequel volumes that
  # have prior-volume golden samples in context.xml.  The prompt loader
  # auto-selects this when context.xml contains <prior_volume_anchors>.
  master_prompt_v2: src/Deepseek/prompt/master_prompt_deepseek_en_v2.xml

  # ── Thinking Log ────────────────────────────────────────────────────────────
  # DeepSeek V4 Pro's reasoning_content shows WHY it made each translation
  # choice — character voice targeting, structural constraints considered.
  # It's already paid for (reasoning tokens are billed as output regardless);
  # saving it per chapter is a free audit trail. ON by default. Leaked
  # <thinking> blocks are always stripped out of the shipped EN chapter
  # regardless of this flag — this only controls whether that reasoning gets
  # archived to a file, not whether the chapter output itself stays clean.
  thinking_log:
    enabled: true                # --no-thinking-log on the CLI overrides this to false
    output_dir: THINKING         # Relative to the volume's work dir: work/<vol_id>/THINKING/

    # ── THINKING Density Map (translator-only telemetry) ────────────────────
    # Rebuilt after every chapter from every THINKING/*.md file on disk —
    # measures how much of context.xml's canon graph each chapter's silent
    # reasoning actually referenced (which blocks, which characters) against
    # how long that reasoning ran. See src/translator/thinking_density.py.
    # Meaningless with thinking_log.enabled: false (nothing to analyze), so
    # this is skipped automatically in that case regardless of this flag.
    density_map:
      enabled: true

  # ════════════════════════════════════════════════════════════════════════
  # DEEPSEEK ROUTE MENU — read by src/Deepseek/translator/config.py when
  # provider: deepseek. Mirrors the qwen: menu below.
  # ════════════════════════════════════════════════════════════════════════
  deepseek:

    # ── Model & Connection ──────────────────────────────────────────────────
    # DeepSeek V4 Pro (~$0.435/$0.87 per MTok input/output, 75% discount).
    # Switch to deepseek-v4-flash for ~3× cheaper throughput ($0.14/$0.28).
    model: deepseek-v4-pro              # deepseek-v4-pro | deepseek-v4-flash

    # Anthropic-compatible Messages endpoint. DeepSeek's native /anthropic
    # path supports the full Messages API including thinking, streaming,
    # and auto-prefix caching. Do NOT change to /v1 (OpenAI format) — the
    # bare client exclusively uses the Anthropic SDK route.
    endpoint: https://api.deepseek.com/anthropic

    # Environment variable holding the API key.
    api_key_env: DEEPSEEK_API_KEY

    # HTTP timeout for single API call (seconds).  600 = 10 minutes,
    # which covers the worst-case 384K-output chapter with thinking.
    http_timeout_seconds: 600

    # ── Generation ──────────────────────────────────────────────────────────
    generation:
      # DeepSeek V4 output ceiling: 384K tokens. The 1M context window
      # minus a generous margin for the system prompt (~200K in the
      # consolidated master prompt) and conversation history.
      max_output_tokens: 384000

      # Nucleus sampling.  0.95 = moderately creative; lower for more
      # deterministic output.  Irrelevant when thinking is enabled
      # (temperature is omitted entirely in thinking mode).
      top_p: 0.95

      # Temperature is intentionally absent from this config. DeepSeek
      # rejects temperature when thinking mode is active. The client
      # automatically omits it when building the API request.

    # ── Thinking / Reasoning ────────────────────────────────────────────────
    thinking:
      # Master toggle. When disabled, the client skips the thinking
      # budget and output_config.effort fields entirely.
      enabled: true

      # Token budget allocated per turn for DeepSeek's internal chain-
      # of-thought (CoT). Rendered as `thinking.budget_tokens` in the
      # Anthropic-format request.  48K is the production value; reduce
      # to 16K for COLD-band chapters if using per-chapter budget routing
      # (not implemented in the bare client — DRDI is the primary
      # reasoning control instead).
      budget_tokens: 64000

      # Anthropic-format effort level. DeepSeek ignores this at the API
      # level (it has no native effort routing), but the client still
      # sends it in output_config for forward-compatibility if DeepSeek
      # ever adds server-side effort support. The actual per-chapter
      # reasoning intensity is controlled via DRDI (see below).
      effort: xhigh                         # max | xhigh/high | medium | low

    # ── Auto-Prefix Cache ───────────────────────────────────────────────────
    caching:
      # DeepSeek automatically caches the longest stable byte-prefix of
      # each request — no cache_control markers needed. The system prompt
      # + context.xml form the stable prefix; per-chapter DRDI + DOVB
      # go into the user turn so they don't break the cache.
      enabled: true

      # Monitor prefix stability and cache hit ratio per chapter.
      # Logs a warning when the hit ratio drops below this threshold.
      cache_monitor:
        enabled: true
        warn_threshold_cache_hit_ratio: 0.70   # warn below 70% hits

      # Track thinking_content token count vs EPS intensity for
      # cost/quality analytics.  Writes per-chapter metrics to the
      # conversation state file.
      thinking_analytics:
        enabled: true

    # ── Persistent Conversation ─────────────────────────────────────────────
    conversation:
      # When enabled, the translator maintains a persistent, append-only
      # conversation transcript across chapters. This gives DeepSeek
      # long-context awareness of prior-chapter translation decisions,
      # character voice consistency, and plot continuity.
      #
      # Disable for fully independent per-chapter translation (useful
      # for testing or when the prompt already carries sufficient context).
      enabled: true

      # Number of most-recent chapters to include verbatim (full JP + EN
      # pair) in each turn. Older chapters are summarized into a
      # continuity checkpoint. 2 is the production value — trimmed from 3
      # to improve cache hit ratio (~82% → ~86% on typical volumes) without
      # meaningful loss of translation-memory context.
      recent_verbatim_chapters: 2

      # Include the EXACT JP source text of recent chapters in the user
      # turn (not just the EN output). Enables DeepSeek to cross-reference
      # its own prior translations against the source. Keep enabled.
      include_exact_jp_task: true

      # Persistence file written to <work_dir>/.context/.
      persistence_file: .context/deepseek_conversation.json

      # ── Compaction Ladder ─────────────────────────────────────────────────
      # As the conversation grows, the prefix approaches the 1M context
      # window. The compaction ladder applies progressively cheaper
      # measures BEFORE the expensive checkpoint summarizer fires:
      #
      #   soft_notice (lowest)  → log only; no mutation, no cost.
      #   tool_snip              → drop stale tool round-trips from old
      #                            turns outside the recent-verbatim window.
      #   checkpoint (trigger)   → generate a compressed continuity XML
      #                            summary via a paid API call. Resets the
      #                            prefix cache (cold start on next turn).
      #   force                  → override the stuck guard. Must stay
      #                            strictly below 1.0.
      #
      # Each ratio is clamped against its neighbour at load time so a bad
      # config edit cannot invert the ladder.

      # Fraction of context window at which the paid checkpoint fires.
      # 0.85 = checkpoint when 85% full.
      checkpoint_trigger_ratio: 0.85

      # Max tokens for the checkpoint summarizer's own output.
      checkpoint_max_output_tokens: 32000

      # If the checkpoint fires on this many consecutive turns, pause
      # automatic checkpointing so the prefix cache can warm again.
      # A checkpoint destroys the cached prefix; back-to-back checkpoints
      # mean the cache never recovers. 2 = standard guard; 0 = disable.
      checkpoint_stuck_guard_turns: 2

      # Compaction ladder rungs (fraction of context window):
      soft_notice_ratio: 0.60             # log warning, no action
      tool_snip_ratio: 0.70               # remove stale tool round-trips
      checkpoint_force_ratio: 0.95        # override stuck guard

      # If the checkpoint summarizer itself fails (API error), should the
      # translation fail closed (abort) or continue without a checkpoint?
      # true = abort (safe); false = continue (risks context overflow).
      fail_closed_on_checkpoint_error: true

    # ── Output Continuation ─────────────────────────────────────────────────
    # When a chapter's response is cut off by the per-turn output cap
    # (stop_reason=max_tokens — which on this endpoint counts reasoning
    # tokens against the same budget as the translation text), the
    # translator issues follow-up calls that continue the translation from
    # exactly where the previous output stopped, instead of shipping a
    # truncated chapter. `max_continuations` caps how many follow-up calls
    # one chapter may take; the partial result is used if the cap is hit.
    continuation:
      enabled: true
      max_continuations: 3

    # ── DeepSeek-Specific Optimizations ─────────────────────────────────────
    optimizations:

      # DRDI — DeepSeek Reasoning Directive Injection.
      # DeepSeek ignores the Anthropic `effort` parameter, so DRDI injects
      # EPS-band CoT scaffolding directly into the user turn. Each EPS
      # band (HOT/WARM/NEUTRAL/COOL/COLD) maps to a prose reasoning
      # directive that tells DeepSeek how deeply to think about the scene.
      #
      # Disable for baseline throughput testing or when running Flash
      # with fixed reasoning budget.
      drdi:
        enabled: true

      # DOVB — DeepSeek-Optimized Voice Block.
      # Generates template-style voice representations tailored to
      # DeepSeek's reasoning style: explicit contraction rewrite rules,
      # forbidden vocabulary lists, speech register templates, and
      # character archetype anchors (tsundere, kuudere, etc.).
      #
      # When disabled, character voice guidance comes only from whatever
      # is baked into context.xml and the master prompt.
      dovb:
        enabled: true

      # CCT — Concurrent Chapter Translation.
      # Async chapter processor for parallel translation. NOT wired into
      # the default sequential flow — this is an opt-in escape hatch for
      # users who want parallelism despite the conversation-history cost.
      # DeepSeek conversation is ordered and append-only; concurrent
      # chapters cannot share conversation state.
      concurrent_chapters:
        enabled: true
        max_concurrent: 3                  # forced to 1 for safety

    # ── Streaming ───────────────────────────────────────────────────────────
    streaming:
      # Stream text_delta and thinking_delta events as they arrive.
      # When disabled, the client waits for the full response.
      enabled: true

    # ── Post-Processing ─────────────────────────────────────────────────────
    post_processing:
      # Format scene breaks (＊  ＊  ＊ → centered asterism, etc.).
      scene_break_formatting: true

      # Strip CJK artifact characters that leak into EN output (fullwidth
      # parentheses, CJK punctuation, ideographic spaces).
      cjk_cleanup: true

      # Salvage chapters accidentally emitted into reasoning_content
      # instead of content (known DeepSeek API edge case).
      salvage_reasoning_leaked_answer: true

    # ── Retry & Resilience ──────────────────────────────────────────────────
    retry:
      max_retries: 5
      base_delay_ms: 500
      max_delay_ms: 32000
      jitter_factor: 0.25
      # 529 Overloaded: don't retry indefinitely. 3 is production value.
      max_529_retries: 3

  # ════════════════════════════════════════════════════════════════════════
  # QWEN ROUTE MENU — read by src/Qwen/config.py when provider: qwen.
  # Mirrors the deepseek: menu above.
  # ════════════════════════════════════════════════════════════════════════
  qwen:
    model: qwen3.7-max
    endpoint: https://dashscope-intl.aliyuncs.com/apps/anthropic
    api_key_env: DASHSCOPE_API_KEY
    http_timeout_seconds: 600

    # Master prompt for the Qwen route. Read by src/Qwen/config.py::
    # get_qwen_prompt_path() whenever translation.provider is "qwen" — the
    # general translation.master_prompt key above belongs to the DeepSeek
    # route and is never consulted by the Qwen client. Swap this path to
    # point the Qwen route at a different prompt without touching code.
    master_prompt: src/Qwen/prompts/master_prompt_qwen_en.xml
    generation:
      # Official Qwen frontier-class rule: when thinking is enabled,
      # max_tokens must exceed thinking.budget_tokens (shared budget for
      # reply + CoT). Applies to every *-max model, not one version of it.
      max_output_tokens: 128000
      top_p: 0.95
    thinking:
      enabled: true
      budget_tokens: 56000
      # Anthropic-compatible multi-turn preserves thinking by returning
      # prior assistant thinking blocks in conversation history (not a
      # request header). preserve_thinking is NOT supported on this route
      # — the conversation manager strips thinking blocks from stored
      # assistant content instead, matching Qwen's documented rule:
      # "retain only the content field and ignore reasoning_content."
    caching:
      enabled: true
      explicit: true                 # cache_control markers on system + latest user
      ttl_minutes: 5                 # official explicit-cache validity window
      cache_monitor:
        enabled: true
        warn_threshold_cache_hit_ratio: 0.70
    streaming:
      enabled: true                  # recommended for long thinking turns
    conversation:
      enabled: true
      recent_verbatim_chapters: 2
      include_exact_jp_task: true
      persistence_file: .context/qwen_conversation.json
      context_window: 1000000
      soft_notice_ratio: 0.60
      compact_ratio: 0.75
      hard_trim_ratio: 0.90
    continuation:
      enabled: true
      max_continuations: 3
      # Official Partial Mode is incompatible with thinking. When true and
      # thinking is on, the client disables thinking for the continuation turn
      # and uses assistant partial=true prefix continuation.
      use_partial_mode: true
    retry:
      max_retries: 5
      base_delay_ms: 500
      max_delay_ms: 32000
      jitter_factor: 0.25
      max_429_retries: 3
    optimizations:
      eps_guidance: true
      voice_block: true
      partial_prefix: true

  # ════════════════════════════════════════════════════════════════════════
  # OPENAI RESPONSES ROUTE MENU — read by src/OpenAI/config.py when
  # provider: openai. The client uses the native OpenAI Responses API.
  # ════════════════════════════════════════════════════════════════════════
  openai:
    # GPT-5.6 Luna trades peak throughput for the lowest current GPT-5.6
    # price tier. It has a 1.05M-token context window and a 128K output cap.
    model: gpt-5.6-luna
    endpoint: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    organization_env: OPENAI_ORG_ID
    project_env: OPENAI_PROJECT_ID
    http_timeout_seconds: 600
    master_prompt: src/OpenAI/prompts/master_prompt_openai_en.md

    generation:
      # Includes both visible output and reasoning tokens on GPT-5.6.
      max_output_tokens: 128000
      service_tier: default            # auto | default | flex | scale | priority | fast — NEVER "standard", that literal does not exist in this enum
      text:
        verbosity: high

    reasoning:
      # Keep the standard model mode unless an operator explicitly selects
      # pro. Effort is independent and defaults to the maximum literary pass.
      mode: pro                 # standard | pro
      effort: xhigh                    # none | minimal | low | medium | high | xhigh | max
      context: all_turns             # auto | current_turn | all_turns
      include_encrypted_content: true

      # Reasoning summary text (a model-generated PARAPHRASE of its
      # reasoning, not the raw chain-of-thought — OpenAI never exposes raw
      # reasoning tokens via the API). This is the ONLY thing that can ever
      # populate THINKING/<chapter>_THINKING.md for this route; without it
      # the request never asks for summary text and the log writer silently
      # writes nothing, every chapter, regardless of thinking_log.enabled.
      # Two dependencies outside this config's control: (1) the API account
      # must complete OpenAI's organization verification before summarizers
      # are returned at all — see
      # https://help.openai.com/en/articles/10910291-api-organization-verification
      # (2) not every model tier supports summaries; gpt-5.6-luna's own
      # model page does not list summary support among its features, unlike
      # plain gpt-5.6. Set to null to stop requesting a summary entirely.
      summary: auto                  # auto | concise | detailed | null

    caching:
      # GPT-5.6 explicit cache breakpoints support only the 30-minute TTL.
      mode: explicit                 # explicit | implicit | disabled
      ttl: 30m
      cache_monitor:
        enabled: true
        # Explicit-only mode intentionally caches the fixed developer prefix,
        # not the entire rolling two-chapter request. Breakpoint recovery is
        # the health signal; total coverage remains a cost metric.
        warn_threshold_breakpoint_success_rate: 0.90
        warn_threshold_prefix_recovery: 0.90
        min_repeat_calls_before_warning: 2

    streaming:
      enabled: true

    conversation:
      # Responses are replayed locally; store:false avoids relying on remote
      # response state. Complete raw output items, including encrypted
      # reasoning, are preserved in this ledger for valid next-turn replay.
      enabled: true
      store: false
      persistence_file: .context/openai_conversation.json
      recent_verbatim_chapters: 2
      context_window: 1050000
      max_input_tokens: 922000
      soft_notice_ratio: 0.60
      compact_ratio: 0.75
      hard_trim_ratio: 0.90

    continuation:
      enabled: true
      max_continuations: 3

    retry:
      max_retries: 5
      base_delay_ms: 500
      max_delay_ms: 32000
      jitter_factor: 0.25
      max_429_retries: 3

    optimizations:
      eps_guidance: true
      voice_block: true

  # ════════════════════════════════════════════════════════════════════════
  # ANTHROPIC (CLAUDE) ROUTE MENU — read by src/Anthropic/config.py when
  # provider: anthropic. Uses the real Anthropic Messages API directly
  # (not an Anthropic-compatible passthrough the way DeepSeek/Qwen do).
  #
  # Scoped, deliberately, to the current Claude-5 family that shares one
  # capability profile end to end: claude-sonnet-5, claude-opus-5,
  # claude-fable-5 — all three adaptive-thinking-only, 1M context, 128K max
  # output, and a hard 400 on any non-default temperature/top_p/top_k
  # regardless of thinking state. Claude Haiku 4.5 (the one current-family
  # model still on manual budget_tokens thinking, 200K context, 64K output)
  # is out of scope for this route by design, not omission.
  # ════════════════════════════════════════════════════════════════════════
  anthropic:
    model: claude-sonnet-5        # claude-sonnet-5 | claude-opus-5 | claude-fable-5
    endpoint: https://api.anthropic.com
    api_key_env: ANTHROPIC_API_KEY
    anthropic_version: "2023-06-01"
    http_timeout_seconds: 600
    master_prompt: src/Anthropic/prompts/master_prompt_anthropic_en.md

    generation:
      # Uniform across all three supported models: 128K is the shared
      # max-output ceiling for claude-sonnet-5/opus-5/fable-5.
      max_output_tokens: 128000
      # temperature / top_p / top_k are intentionally absent. Non-default
      # values on any of them are a hard 400 on every model this route
      # supports, regardless of thinking state — the client never sends them.

    # ── Adaptive Thinking ────────────────────────────────────────────────────
    thinking:
      # Master toggle. claude-fable-5 rejects thinking:{type:"disabled"}
      # outright — the client keeps thinking on for that model even if this
      # is set to false.
      enabled: true

      # "summarized" returns readable thinking text (billed the same either
      # way); "omitted" returns an empty thinking field for faster
      # time-to-first-text-token. Defaults to "omitted" on the raw API —
      # set to "summarized" here so THINKING/*.md logs actually capture text.
      display: summarized              # summarized | omitted

      # output_config.effort — steers reasoning depth in adaptive mode.
      # Default on the API is "high"; xhigh/max cost more but reason deeper.
      effort: high                     # max | xhigh | high | medium | low

    # ── Prompt Caching ───────────────────────────────────────────────────────
    caching:
      enabled: true
      # 5m is the default TTL (1.25x write / 0.1x read pricing multiplier);
      # 1h costs 2x on write but survives longer thinking-heavy sessions.
      ttl: 5m                          # 5m | 1h
      cache_monitor:
        enabled: true
        warn_threshold_cache_hit_ratio: 0.70

    # ── Batch API ────────────────────────────────────────────────────────────
    # Opt-in async path (src/Anthropic/batch.py): submits every pending
    # chapter as one Message Batches job instead of translating sequentially.
    # Never a silent fallback from the synchronous path — a deliberate
    # cost/latency trade the operator switches on explicitly.
    batch:
      enabled: false
      # No anthropic-beta headers are ever sent on this route (sync or
      # batch) — deliberately: a beta flag tied to a dated feature can go
      # stale/unrecognized server-side and turn into a hard 400 on every
      # request that carries it. Batch requests use the plain 128K ceiling.
      poll_seconds: 60
      completion_window: 24h
      persistence_file: .context/anthropic_batch_state.json

    # ── Streaming ───────────────────────────────────────────────────────────
    streaming:
      enabled: true

    # ── Persistent Conversation ─────────────────────────────────────────────
    conversation:
      enabled: true
      recent_verbatim_chapters: 2
      persistence_file: .context/anthropic_conversation.json
      context_window: 1000000
      soft_notice_ratio: 0.60
      compact_ratio: 0.75
      hard_trim_ratio: 0.90

    # ── Output Continuation ──────────────────────────────────────────────────
    continuation:
      enabled: true
      max_continuations: 3

    # ── Retry & Resilience ───────────────────────────────────────────────────
    retry:
      max_retries: 5
      base_delay_ms: 500
      max_delay_ms: 32000
      jitter_factor: 0.25
      max_429_retries: 3
      # Anthropic's distinct overloaded_error/529 — tracked separately from
      # the general retry ceiling, same reasoning DeepSeek applies to its own.
      max_529_retries: 3

    optimizations:
      eps_guidance: true
      voice_block: true

  # ════════════════════════════════════════════════════════════════════════
  # SAFETY-REFUSAL FALLBACK (Qwen → DeepSeek)
  # ════════════════════════════════════════════════════════════════════════
  # When Qwen's content moderation refuses a chapter (QwenModerationError,
  # HTTP 400 family — e.g. code="InvalidParameter" + "inappropriate
  # content"), the refusal is deterministic: retrying the same payload
  # against the same gate fails identically. The client therefore does NOT
  # retry. Instead it hands the chapter to the DeepSeek route — but not
  # cold. Before the DeepSeek payload is built, an inheritance agent (one
  # DeepSeek call running on the PREP config — model/endpoint/key below)
  # reads every EN chapter Qwen has already produced, summarizes the
  # translation decisions Qwen established (names, honorifics, voice,
  # terminology, style), and injects that summary into a
  # <translation_inheritance> block in context.xml with a marker, so the
  # DeepSeek run inherits all of Qwen's decisions instead of reinventing
  # them. The block is seeded <pending/> by the Librarian and left pending
  # by prep; it is populated only at runtime when a safety refusal fires.
  safety_fallback:
    # Default ON for every non-DeepSeek Phase 2 provider — Qwen, Anthropic,
    # OpenAI, and any future provider added to this route. Not a per-provider
    # opt-in: src/Deepseek/common/safety_fallback.py is the one shared
    # mechanism every provider's translate_chapter is expected to call on a
    # content-safety refusal, the same way every provider must match
    # translate_volume's call signature — see that module's docstring for
    # the contract new providers are expected to satisfy.
    enabled: true
    fallback_provider: deepseek            # the only fallback target — DeepSeek is the one
                                            # route with no content-moderation gate of its own
    block_name: translation_inheritance    # context.xml block injected on refusal
    # No static marker here on purpose: leaving this unset lets the code
    # build "This run succeeds from <Provider>'s safety refusal..." with the
    # actual source provider's name. Setting a marker string here overrides
    # that for every provider verbatim — only do so deliberately.
    # The inheritance agent runs on the PREP config (model/endpoint/api_key)
    # — same credentials and endpoint prep uses, one-shot summarization call.
    inherit_agent:
      enabled: true
      prompt: src/Qwen/prompts/inherit_decisions_prompt.xml

# ── EPUB Builder ────────────────────────────────────────────────────────────
builder:
  # Font embedding for CJK glyph coverage in the output EPUB.
  # Paths relative to LLM Translator/ root.
  fonts:
    enabled: true
    # Add font paths here if you have custom CJK fonts
    # japanese: fonts/NotoSansJP-Regular.otf
    # english: fonts/NotoSerif-Regular.otf

  # Target device for the build. Overridable per run with --profile.
  #   passthrough  images copied untouched; reproduces pre-profile output
  #   standard     300 PPI readers (Kindle, Kobo, tablets)
  #   xteink-x3    XTEINK X3, 528x792 1-bit e-ink, CrossPoint firmware
  #   xteink-x4    XTEINK X4, 480x800 1-bit e-ink, CrossPoint firmware
  # The xteink profiles convert art to 8-bit grayscale, fit it to the panel,
  # force baseline JPEG (progressive does not decode on those devices) and
  # swap in a stylesheet limited to the nine CSS properties the firmware
  # actually implements. See src/builder/device_profiles.py.
  device_profile: standard

  # Image optimization for cover/kuchie/illustrations.
  # Consumed by the 'standard' profile; the xteink profiles carry their own
  # panel-derived values and ignore these.
  images:
    max_width_px: 1200
    max_height_px: 1800
    jpeg_quality: 85

  # Optional XTC/XTCH export — the CrossPoint firmware's native format, which
  # stores PRE-RENDERED bitmap pages rather than text. Opt-in and off by
  # default, because the trade is real: a ~400-page volume goes from ~1-2 MB to
  # ~19 MB (xtc) or ~38 MB (xtch), and the reader permanently loses the ability
  # to change font, size or margins. What it buys is the elimination of the
  # 5-10s first-chapter parse, which the device already caches after one open.
  #
  # Rendering is delegated to https://github.com/bigbag/epub-to-xtc-converter
  # (Node 18+, CREngine WASM). Clone it, run `npm install` in its cli/ dir, and
  # point converter_path at the checkout. Do not vendor it into this repo.
  xtc:
    enabled: false
    # Cloned outside this repo per the "do not vendor" note above.
    converter_path: "D:/epub-to-xtc-converter"
    node_bin: ""              # blank = find 'node' on PATH
    format: xtc               # xtc (1-bit) | xtch (2-bit grayscale, ~2x size)
    # XTEINK-spec'd Bookerly (serif, matches the Kindle reading face). The
    # converter's own registerFont() call only ever loads ONE face per run
    # (converter.js: a single registerFontFromMemory() call, no bold/italic
    # slot anywhere in cli/settings.js's schema) — CREngine synthesizes
    # bold/italic algorithmically from this Regular face rather than using
    # true hinted variants. Bookerly-Bold/-Italic/-BoldItalic.ttf sit beside
    # this file in the converter's fonts/ dir for if that ever gets patched
    # to support multiple registered faces; they are not consumed today.
    # The device's original Bookerly XTEINK_*.cpfont files (dev/Bookerly/)
    # are a different, CrossPoint-firmware-native bitmap format ("CPFONT"
    # magic header) for the device's own on-firmware renderer — CREngine's
    # FreeType-based rasterizer cannot load them; only real TTF/OTF works.
    font_path: "D:/epub-to-xtc-converter/fonts/Bookerly-Regular.ttf"
    timeout_seconds: 1800
    # Passed through to the converter's settings.json verbatim (deep-merged
    # over the defaults its own `init` generates). The schema belongs to that
    # tool, not to us, so anything not listed above goes here.
    settings: {}

# ── Logging ─────────────────────────────────────────────────────────────────
logging:
  level: INFO                           # DEBUG | INFO | WARNING | ERROR
  file: logs/llm_translator.log
  # Log API cost per chapter (input/output/cache tokens → USD)
  cost_tracking: true

# ── MCP Harness ─────────────────────────────────────────────────────────────
# The harness is loaded by src/mcp/harness.py and injected as the system
# identity prefix before every LLM call the MCP server makes (prep, translate).
mcp_harness:
  persona:
    # Central persona file — full port of CLAUDE.md for LLM API consumption.
    # Loaded at MCP server startup, cached in memory, prepended to every
    # system instruction built by harness.build_system_instruction().
    file: .github/PERSONA.md
    enabled: true              # ← the only knob the user touches

  subagents:
    prep:
      enabled: true
      model: deepseek-v4-flash
      thinking_budget: 64000
      effort: xhigh
      max_output_tokens: 128000

    translator:
      harness_managed: true   # DeepSeekClient owns its config (translation.deepseek)

    qc:
      enabled: true            # Agent-managed — see top-level §qc for model config

    bible_writer:
      enabled: true            # Filesystem-only, no LLM call

# ── QC Gate Configuration ───────────────────────────────────────────────────
# Model, thinking, and token parameters for the QC agent family.
# Pro uses max reasoning for semantic literary analysis (voice differentiation,
# emotional fidelity, SSP calibration, exemplar generation). Flash is reserved
# for lightweight pre-flight checks only — never literary evaluation.
#
# Per-agent thinking budgets are in each agent's YAML frontmatter
# (thinkingBudget: 36000 for prose sub-agents). This section defines the
# ceiling and the model routing. The frontmatter budget cannot exceed
# the max_output_tokens defined here.
qc:
  # ── Model Selection ──────────────────────────────────────────────────────
  # Primary model for all semantic QC analysis. Pro tier is mandatory for
  # literary evaluation — Flash cannot perform the structured comparison
  # and forensic reasoning required by the §E.4 exemplar chain.
  model: deepseek-v4-pro

  # Lightweight model for pre-flight structural checks only.
  # qc-structural uses this when invoked standalone (Mode A).
  # Never used for prose, names, or linguistic analysis.
  flash_model: deepseek-v4-flash

  # ── Endpoint ──────────────────────────────────────────────────────────────
  endpoint: https://api.deepseek.com/anthropic
  api_key_env: DEEPSEEK_API_KEY
  http_timeout_seconds: 900             # 15 minutes for worst-case volume scan

  # ── Context & Output Ceilings ────────────────────────────────────────────
  # Maxed at DeepSeek V4 Pro's documented limits. The full 1M context is
  # needed to hold agent instructions + context.xml + all EN/JP chapters +
  # golden samples simultaneously. 384K output ensures room for the full
  # locked-format audit with 9+ exemplars.
  context_window: 1000000
  max_output_tokens: 384000

  # ── Thinking / Reasoning ──────────────────────────────────────────────────
  thinking:
    enabled: true
    # Pro ceiling. The YAML frontmatter per-agent thinkingBudget (currently
    # 36000 for prose sub-agents) must not exceed this value. Orchestrator
    # agents (mtl-qc, qc-prose) use a lower budget since they aggregate
    # rather than analyze — defined in their respective frontmatter.
    budget_tokens: 64000                # PRO ceiling — per-agent budgets ≤ this
    effort: xhigh                       # max | high | medium | low

  # ── Agent-Specific Budget Overrides ───────────────────────────────────────
  # These override the per-agent YAML frontmatter thinkingBudget when the
  # agent is invoked through the MCP harness. Frontmatter values are
  # authoritative when agents run as VS Code sub-agents.
  agent_budgets:
    # Orchestrators — aggregation, not analysis
    mtl-qc: 16000                       # mode detection + dispatch + gate decision
    qc-prose: 16000                     # provenance detection + sub-agent aggregation

    # Tier 1 — mechanical/pattern checks (lower reasoning demand)
    qc-structural: 8000                 # file integrity, headings, encoding
    qc-names: 12000                     # name drift, honorifics, term locks
    qc-linguistic: 16000                # CJK residue, calques, grammar, W4W errors

    # Tier 2 — semantic literary analysis (highest reasoning demand)
    qc-prose-character: 36000           # voice distinctiveness, contamination, archetypes
    qc-prose-narrator: 36000            # sentence variety, repetition, filter words, POV
    qc-prose-emotional-peak: 36000      # emotional fidelity, subtext, SSP beat comparison

  # ── SSP Golden Sample Routing ─────────────────────────────────────────────
  golden_samples:
    # Directory containing extracted SSP calibration passages.
    # Indexed by golden-samples-index.md with LCI dimension mapping.
    registry_dir: .github/agents/reference/

    # Auto-detect Mode B-Deep when golden samples exist for the volume's
    # series. When true, any QC invocation against a volume with matching
    # golden samples automatically runs the full literary craft scan.
    auto_deep_scan: true

    # Load all matching series samples, not just the primary match.
    # Required for §E.0 Register Provenance — composite calibration
    # needs cross-series comparison data.
    load_all_matching: true
